name: Windows validation

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npx playwright install chromium

      - name: Run full Windows verification
        shell: pwsh
        env:
          # Keep installer path comparisons on the same long-path representation.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm run check:full:windows

      - name: Build isolated Dev package
        shell: pwsh
        run: npm run build:dev-package

      - name: Verify Dev artifacts exist
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'POPO-Dev-Downloader-*-win-x64.zip' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Dev ZIP, found $($packages.Count)."
          }
          $checksumPath = "$($packages[0].FullName).sha256.txt"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Dev ZIP checksum was not produced: $checksumPath"
          }

      - name: Upload Dev package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popo-dev-windows-${{ github.sha }}
          path: |
            dist/POPO-Dev-Downloader-*-win-x64.zip
            dist/POPO-Dev-Downloader-*-win-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
